    <path d="M265 265h256" stroke="#edf2f7" stroke-width="3" opacity=".72"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M322 327l45-34 47 37" stroke="#ffffff" stroke-width="5"/>
      <circle cx="322" cy="327" r="12" fill="#171a1f" stroke="#ffffff" stroke-width="5"/>
      <circle cx="367" cy="293" r="12" fill="#f0a500" stroke="#ffffff" stroke-width="5"/>
      <circle cx="414" cy="330" r="12" fill="#f0a500" stroke="#ffffff" stroke-width="5"/>
      <circle cx="474" cy="329" r="60" fill="#171a1f" stroke="#f0a500" stroke-width="12"/>
