    <rect x="468" y="89" width="75" height="40" rx="10" fill="#f0a500"/>
    <text x="505.5" y="115" text-anchor="middle" fill="#171a1f" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">Search</text>
  </g>

  <g opacity=".85">
    <circle cx="64" cy="93" r="6" fill="#edf2f7"/><circle cx="87" cy="376" r="5" fill="#f0a500"/>
    <circle cx="704" cy="95" r="5" fill="#f0a500"/><circle cx="713" cy="388" r="6" fill="#edf2f7" opacity=".7"/>
