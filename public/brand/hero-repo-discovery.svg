<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Repo Fetch repository discovery illustration</title>
  <desc id="desc">A stylised repository folder with connected nodes, search lens, repository cards and network lines in charcoal, white and gold.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2d333b" stroke-width="1" opacity="0.34"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#090b0e" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="758" height="468" rx="28" fill="#171a1f" stroke="#2d333b" stroke-width="2"/>
  <rect x="1" y="1" width="758" height="468" rx="28" fill="url(#grid)" opacity="0.62"/>
  <circle cx="641" cy="99" r="89" fill="none" stroke="#edf2f7" stroke-width="1.5" opacity="0.22"/>
  <path d="M552 99h178M641 10c-36 34-54 64-54 89s18 55 54 89M641 10c36 34 54 64 54 89s-18 55-54 89" fill="none" stroke="#edf2f7" stroke-width="1.2" opacity="0.16"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 112h116c25 0 25 44 52 44h52" stroke="#f0a500" stroke-width="5"/>
    <path d="M500 151h76c30 0 27 43 58 43h42" stroke="#f0a500" stroke-width="5"/>
    <path d="M113 344h90c31 0 28-35 57-35h55" stroke="#4a5568" stroke-width="4"/>
    <circle cx="108" cy="112" r="8" fill="#f0a500" stroke="#f0a500"/>
    <circle cx="276" cy="156" r="9" fill="#171a1f" stroke="#f0a500" stroke-width="5"/>
    <circle cx="576" cy="151" r="8" fill="#171a1f" stroke="#f0a500" stroke-width="5"/>
    <circle cx="676" cy="194" r="7" fill="#f0a500" stroke="#f0a500"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="58" y="146" width="226" height="166" rx="15" fill="#f7f8fa" stroke="#e1e5ea" stroke-width="2"/>
    <text x="80" y="178" fill="#171a1f" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Repositories</text>
    <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#4a5568">
      <rect x="80" y="196" width="25" height="21" rx="4" fill="#171a1f"/><text x="118" y="211">react</text><circle cx="247" cy="206" r="4" fill="#f0a500"/>
      <rect x="80" y="229" width="25" height="21" rx="4" fill="#171a1f"/><text x="118" y="244">next.js</text><circle cx="247" cy="239" r="4" fill="#f0a500"/>
      <rect x="80" y="262" width="25" height="21" rx="4" fill="#171a1f"/><text x="118" y="277">typescript</text><circle cx="247" cy="272" r="4" fill="#f0a500"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="208" width="210" height="150" rx="16" fill="#20252c" stroke="#4a5568" stroke-width="2"/>
    <circle cx="512" cy="229" r="4" fill="#f0a500"/><circle cx="526" cy="229" r="4" fill="#edf2f7" opacity=".7"/>
    <text x="512" y="266" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">owner/repository</text>
    <text x="512" y="292" fill="#aeb7c4" font-family="Inter,Arial,sans-serif" font-size="13">main  •  JavaScript</text>
