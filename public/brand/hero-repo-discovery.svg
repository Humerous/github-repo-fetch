  <g filter="url(#shadow)">
    <rect x="211" y="74" width="350" height="70" rx="17" fill="#ffffff" stroke="#e1e5ea" stroke-width="2"/>
    <circle cx="245" cy="108" r="11" fill="none" stroke="#171a1f" stroke-width="4"/><path d="M253 116l10 10" stroke="#171a1f" stroke-width="4" stroke-linecap="round"/>
